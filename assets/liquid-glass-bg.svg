<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200" viewBox="0 0 1920 1200">
<defs>
 <linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#02050b"/><stop offset=".48" stop-color="#080e19"/><stop offset="1" stop-color="#03050b"/></linearGradient>
 <radialGradient id="blueGlow"><stop stop-color="#75baff" stop-opacity=".46"/><stop offset=".38" stop-color="#3675bb" stop-opacity=".2"/><stop offset="1" stop-color="#0a1425" stop-opacity="0"/></radialGradient>
 <radialGradient id="violetGlow"><stop stop-color="#aa91ff" stop-opacity=".34"/><stop offset=".42" stop-color="#6552a9" stop-opacity=".13"/><stop offset="1" stop-color="#080b16" stop-opacity="0"/></radialGradient>
 <linearGradient id="glassA" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4f9ff" stop-opacity=".02"/><stop offset=".16" stop-color="#d8edff" stop-opacity=".24"/><stop offset=".34" stop-color="#8dbdff" stop-opacity=".07"/><stop offset=".55" stop-color="#fff" stop-opacity=".015"/><stop offset=".76" stop-color="#a8a1ff" stop-opacity=".16"/><stop offset="1" stop-color="#d9edff" stop-opacity=".035"/></linearGradient>
 <linearGradient id="glassB" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#9acbff" stop-opacity=".025"/><stop offset=".24" stop-color="#cce7ff" stop-opacity=".18"/><stop offset=".5" stop-color="#fff" stop-opacity=".035"/><stop offset=".73" stop-color="#9b8fff" stop-opacity=".13"/><stop offset="1" stop-color="#dff4ff" stop-opacity=".025"/></linearGradient>
 <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".7"/><stop offset=".28" stop-color="#b9dcff" stop-opacity=".12"/><stop offset=".62" stop-color="#c4b8ff" stop-opacity=".38"/><stop offset="1" stop-color="#fff" stop-opacity=".08"/></linearGradient>
 <linearGradient id="edge2" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#fff" stop-opacity=".05"/><stop offset=".35" stop-color="#c8e7ff" stop-opacity=".55"/><stop offset=".68" stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#c4b6ff" stop-opacity=".38"/></linearGradient>
 <radialGradient id="glassOrb"><stop offset=".48" stop-color="#a9d5ff" stop-opacity="0"/><stop offset=".68" stop-color="#b9dcff" stop-opacity=".04"/><stop offset=".76" stop-color="#e4f4ff" stop-opacity=".24"/><stop offset=".8" stop-color="#9ebeff" stop-opacity=".06"/><stop offset="1" stop-color="#9fc8ff" stop-opacity="0"/></radialGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="78"/></filter><filter id="soft"><feGaussianBlur stdDeviation="28"/></filter><filter id="shine"><feGaussianBlur stdDeviation="7"/></filter>
 <pattern id="grain" width="140" height="140" patternUnits="userSpaceOnUse"><circle cx="17" cy="24" r=".8" fill="#d9eaff" opacity=".12"/><circle cx="92" cy="71" r=".7" fill="#fff" opacity=".08"/><circle cx="128" cy="119" r=".8" fill="#b8cfff" opacity=".08"/></pattern>
</defs>
<rect width="1920" height="1200" fill="url(#night)"/>
<ellipse cx="180" cy="190" rx="620" ry="500" fill="url(#blueGlow)" filter="url(#blur)"/>
<ellipse cx="1740" cy="260" rx="650" ry="560" fill="url(#violetGlow)" filter="url(#blur)"/>
<ellipse cx="980" cy="1150" rx="900" ry="350" fill="url(#blueGlow)" opacity=".48" filter="url(#blur)"/>
<!-- Deep glass lens -->
<circle cx="1570" cy="565" r="540" fill="url(#glassOrb)"/>
<circle cx="1570" cy="565" r="420" fill="none" stroke="url(#glassA)" stroke-width="118"/>
<circle cx="1570" cy="565" r="420" fill="none" stroke="url(#edge)" stroke-width="2.5"/>
<circle cx="1570" cy="565" r="478" fill="none" stroke="#d8ebff" stroke-opacity=".09" stroke-width="1.5"/>
<!-- Wide liquid-glass ribbon sweeping through the scene -->
<path d="M-190 900 C120 620 350 545 590 700 C820 850 970 1050 1215 900 C1450 755 1605 400 2110 455" fill="none" stroke="#72b5ff" stroke-opacity=".17" stroke-width="190" stroke-linecap="round" filter="url(#soft)"/>
<path d="M-190 900 C120 620 350 545 590 700 C820 850 970 1050 1215 900 C1450 755 1605 400 2110 455" fill="none" stroke="url(#glassA)" stroke-width="142" stroke-linecap="round"/>
<path d="M-190 900 C120 620 350 545 590 700 C820 850 970 1050 1215 900 C1450 755 1605 400 2110 455" fill="none" stroke="url(#edge)" stroke-width="3" stroke-linecap="round"/>
<path d="M-190 872 C120 592 350 517 590 672 C820 822 970 1022 1215 872 C1450 727 1605 372 2110 427" fill="none" stroke="#f1f8ff" stroke-opacity=".18" stroke-width="2" stroke-linecap="round" filter="url(#shine)"/>
<!-- Second floating translucent glass sheet -->
<path d="M-160 180 C160 390 390 420 620 275 C845 135 1015 -40 1260 105 C1500 248 1660 425 2100 190" fill="none" stroke="#9dc8ff" stroke-opacity=".12" stroke-width="150" stroke-linecap="round" filter="url(#blur)"/>
<path d="M-160 180 C160 390 390 420 620 275 C845 135 1015 -40 1260 105 C1500 248 1660 425 2100 190" fill="none" stroke="url(#glassB)" stroke-width="100" stroke-linecap="round"/>
<path d="M-160 180 C160 390 390 420 620 275 C845 135 1015 -40 1260 105 C1500 248 1660 425 2100 190" fill="none" stroke="url(#edge2)" stroke-width="2.5" stroke-linecap="round"/>
<!-- A folded, curved glass fin -->
<path d="M250 1230 C430 920 600 750 815 720 C1040 690 1210 850 1390 790 C1570 730 1690 560 1850 300" fill="none" stroke="#b9d8ff" stroke-opacity=".12" stroke-width="76" stroke-linecap="round" filter="url(#soft)"/>
<path d="M250 1230 C430 920 600 750 815 720 C1040 690 1210 850 1390 790 C1570 730 1690 560 1850 300" fill="none" stroke="url(#glassB)" stroke-width="48" stroke-linecap="round"/>
<path d="M250 1230 C430 920 600 750 815 720 C1040 690 1210 850 1390 790 C1570 730 1690 560 1850 300" fill="none" stroke="url(#edge)" stroke-width="1.8" stroke-linecap="round"/>
<!-- Prismatic edge glints -->
<path d="M1285 105 C1430 205 1480 335 1515 448" fill="none" stroke="#eaf6ff" stroke-opacity=".45" stroke-width="3" filter="url(#shine)"/>
<path d="M1740 800 C1830 715 1890 610 1950 495" fill="none" stroke="#d2c8ff" stroke-opacity=".36" stroke-width="3" filter="url(#shine)"/>
<path d="M120 825 C260 725 365 690 485 710" fill="none" stroke="#b9ddff" stroke-opacity=".28" stroke-width="2.5" filter="url(#shine)"/>
