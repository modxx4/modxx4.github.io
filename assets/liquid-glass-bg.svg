<g fill="none" stroke="#d6e9ff" stroke-opacity=".12" stroke-width="1.4"><circle cx="1570" cy="565" r="565"/><circle cx="1570" cy="565" r="332"/><path d="M1570 0v58M1570 1072v75M1000 565h72M2068 565h74"/></g>
<g fill="#e6f3ff"><circle cx="390" cy="300" r="2.2" opacity=".42"/><circle cx="1320" cy="1030" r="2" opacity=".34"/><circle cx="1810" cy="245" r="1.8" opacity=".4"/></g>
<rect width="1920" height="1200" fill="url(#grain)" opacity=".58"/>
<rect width="1920" height="1200" fill="#01040a" opacity=".12"/>
</svg>