<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200" viewBox="0 0 1920 1200">
<defs>
 <linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#03050a"/><stop offset=".48" stop-color="#070b13"/><stop offset="1" stop-color="#020409"/></linearGradient>
 <radialGradient id="ice"><stop stop-color="#8ec8ff" stop-opacity=".46"/><stop offset=".32" stop-color="#3e79b8" stop-opacity=".2"/><stop offset="1" stop-color="#0a1424" stop-opacity="0"/></radialGradient>
 <radialGradient id="violet"><stop stop-color="#a48bff" stop-opacity=".32"/><stop offset=".38" stop-color="#6553a5" stop-opacity=".13"/><stop offset="1" stop-color="#090b16" stop-opacity="0"/></radialGradient>
 <radialGradient id="halo"><stop offset=".52" stop-color="#9fcfff" stop-opacity="0"/><stop offset=".7" stop-color="#9fcfff" stop-opacity=".04"/><stop offset=".76" stop-color="#c6e3ff" stop-opacity=".3"/><stop offset=".79" stop-color="#7b9fc9" stop-opacity=".06"/><stop offset="1" stop-color="#91bfff" stop-opacity="0"/></radialGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4f8ff" stop-opacity=".02"/><stop offset=".2" stop-color="#c9e5ff" stop-opacity=".2"/><stop offset=".42" stop-color="#fff" stop-opacity=".025"/><stop offset=".68" stop-color="#8fb9f0" stop-opacity=".13"/><stop offset=".86" stop-color="#c7b8ff" stop-opacity=".09"/><stop offset="1" stop-color="#fff" stop-opacity=".02"/></linearGradient>
 <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f3f8ff" stop-opacity=".55"/><stop offset=".4" stop-color="#b9d9ff" stop-opacity=".08"/><stop offset=".72" stop-color="#c7b7ff" stop-opacity=".3"/><stop offset="1" stop-color="#fff" stop-opacity=".04"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="70"/></filter><filter id="soft"><feGaussianBlur stdDeviation="24"/></filter><filter id="glow"><feGaussianBlur stdDeviation="8"/></filter>
 <pattern id="grain" width="150" height="150" patternUnits="userSpaceOnUse"><circle cx="18" cy="23" r=".8" fill="#d9e9ff" opacity=".12"/><circle cx="93" cy="68" r=".7" fill="#fff" opacity=".08"/><circle cx="135" cy="127" r=".8" fill="#b8cfff" opacity=".09"/><circle cx="49" cy="139" r=".6" fill="#fff" opacity=".07"/></pattern>
</defs>
<rect width="1920" height="1200" fill="url(#night)"/>
<!-- Atmospheric light, kept around the perimeter for clear foreground content -->
<ellipse cx="240" cy="160" rx="600" ry="470" fill="url(#ice)" filter="url(#blur)"/>
<ellipse cx="1760" cy="260" rx="620" ry="540" fill="url(#violet)" filter="url(#blur)"/>
<ellipse cx="940" cy="1180" rx="900" ry="330" fill="url(#ice)" opacity=".42" filter="url(#blur)"/>
<!-- Monumental translucent glass orbit -->
<circle cx="1600" cy="590" r="520" fill="url(#halo)"/>
<circle cx="1600" cy="590" r="390" fill="none" stroke="url(#glass)" stroke-width="100"/>
<circle cx="1600" cy="590" r="390" fill="none" stroke="url(#shine)" stroke-width="2"/>
<circle cx="1600" cy="590" r="455" fill="none" stroke="#c6ddff" stroke-opacity=".07" stroke-width="1.5"/>
<circle cx="1600" cy="590" r="325" fill="none" stroke="#c6ddff" stroke-opacity=".055" stroke-width="1"/>
<!-- Flowing glass ribbons -->
<path d="M-180 910 C120 620 340 570 590 720 S1010 1040 1280 820 S1640 400 2110 480" fill="none" stroke="#8ebeff" stroke-opacity=".12" stroke-width="150" stroke-linecap="round" filter="url(#soft)"/>
<path d="M-180 910 C120 620 340 570 590 720 S1010 1040 1280 820 S1640 400 2110 480" fill="none" stroke="url(#glass)" stroke-width="92" stroke-linecap="round"/>
<path d="M-180 910 C120 620 340 570 590 720 S1010 1040 1280 820 S1640 400 2110 480" fill="none" stroke="url(#shine)" stroke-width="2.5" stroke-linecap="round"/>
<path d="M-160 170 C160 390 390 400 610 260 S1020 -30 1280 130 S1690 400 2100 170" fill="none" stroke="#a9caff" stroke-opacity=".08" stroke-width="120" stroke-linecap="round" filter="url(#blur)"/>
<path d="M-160 170 C160 390 390 400 610 260 S1020 -30 1280 130 S1690 400 2100 170" fill="none" stroke="url(#glass)" stroke-width="64" stroke-linecap="round"/>
<path d="M-160 170 C160 390 390 400 610 260 S1020 -30 1280 130 S1690 400 2100 170" fill="none" stroke="url(#shine)" stroke-width="2" stroke-linecap="round"/>
<!-- Small prismatic light cuts -->
<path d="M1310 150 C1450 235 1490 340 1510 445" fill="none" stroke="#e4f2ff" stroke-opacity=".28" stroke-width="2" filter="url(#glow)"/>
<path d="M1730 790 C1820 710 1880 620 1940 510" fill="none" stroke="#c5b7ff" stroke-opacity=".25" stroke-width="2" filter="url(#glow)"/>
<path d="M150 820 C260 730 370 700 480 720" fill="none" stroke="#a7d1ff" stroke-opacity=".18" stroke-width="2" filter="url(#glow)"/>
<!-- Minimal orbital markers -->
<g fill="none" stroke="#cfe2ff" stroke-opacity=".13" stroke-width="1.5"><circle cx="1600" cy="590" r="555"/><path d="M1600 8v65M1600 1107v65M1018 590h65M2117 590h65" stroke-opacity=".1"/><circle cx="390" cy="300" r="4" fill="#d7eaff" fill-opacity=".32" stroke="none"/><circle cx="1320" cy="1030" r="3" fill="#c7b8ff" fill-opacity=".35" stroke="none"/></g>
<rect width="1920" height="1200" fill="url(#grain)" opacity=".58"/>
<rect width="1920" height="1200" fill="#010308" opacity=".2"/>
</svg>