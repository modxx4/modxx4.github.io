<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200" viewBox="0 0 1920 1200">
<defs>
 <linearGradient id="base" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030509"/><stop offset=".48" stop-color="#0b101a"/><stop offset="1" stop-color="#03050a"/></linearGradient>
 <radialGradient id="blueGlow"><stop stop-color="#7199d0" stop-opacity=".42"/><stop offset=".42" stop-color="#344d76" stop-opacity=".19"/><stop offset="1" stop-color="#0a101b" stop-opacity="0"/></radialGradient>
 <radialGradient id="violetGlow"><stop stop-color="#9b83d2" stop-opacity=".26"/><stop offset=".48" stop-color="#51466e" stop-opacity=".12"/><stop offset="1" stop-color="#0a0c14" stop-opacity="0"/></radialGradient>
 <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".02"/><stop offset=".24" stop-color="#b9d5fa" stop-opacity=".16"/><stop offset=".48" stop-color="#fff" stop-opacity=".035"/><stop offset=".72" stop-color="#8aa8d4" stop-opacity=".10"/><stop offset="1" stop-color="#fff" stop-opacity=".015"/></linearGradient>
 <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e3efff" stop-opacity=".34"/><stop offset=".42" stop-color="#a8c9f3" stop-opacity=".04"/><stop offset=".75" stop-color="#b5a2ed" stop-opacity=".18"/><stop offset="1" stop-color="#e9f3ff" stop-opacity=".08"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="58"/></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="20"/></filter>
 <filter id="glow"><feGaussianBlur stdDeviation="7"/></filter>
