<!DOCTYPE html>
<html lang="en" manifest="NEXUS5.manifest">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MODX — PSFree 9.xx Cache / GoldHEN 2.4b18.10</title>
    <script>history.replaceState(null, null, 'index5.html');</script>
    <style>
        :root { --bg:#151515; --panel:#1c1c1c; --panel-2:#242424; --line:#2e2e2e; --line-bright:#454545; --text:#f5f5f5; --muted:#b5b5b5; --dim:#828282; --accent:#27b8ff; }
        * { box-sizing:border-box; margin:0; padding:0; }
        html { background:var(--bg); }
        html, body { min-height:100%; }
        body { background-color:var(--bg); background-image:linear-gradient(rgba(39,184,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(39,184,255,.055) 1px,transparent 1px); background-size:36px 36px; color:var(--text); display:flex; flex-direction:column; font:17px/1.4 Consolas,"Liberation Mono",monospace; min-height:100vh; overflow:hidden; }
        a { color:inherit; }
        .app { display:flex; flex:1 0 auto; flex-direction:column; margin:0 auto; padding:14px 26px 12px; width:min(100% - 52px,920px); }
        .bar { align-items:center; border:1px solid var(--line-bright); display:flex; font-size:14px; justify-content:space-between; letter-spacing:.1em; padding:10px 16px; text-transform:uppercase; }
        .bar b { color:var(--accent); font-weight:400; }
        .bar-fw { color:var(--dim); }
        .bar-fw::before { color:var(--accent); content:"\25CF "; }
        .layout { display:flex; flex:1 0 auto; flex-direction:column; justify-content:center; padding:20px 0 0; }
        .kicker { color:var(--accent); font-size:14px; letter-spacing:.14em; margin:0 0 12px; }
        h1 { font-size:clamp(32px,5vw,52px); font-weight:400; letter-spacing:-.07em; line-height:1; margin:0; }
        h1 em { color:var(--accent); font-style:normal; }
        .boot { color:var(--dim); font-size:14px; list-style:none; margin:12px 0 0; }
        .boot li { margin:3px 0; }
        .boot b { color:var(--accent); font-weight:400; }
        .progress-container { margin-top:20px; width:100%; }
        .progress-label { color:var(--accent); font-size:15px; margin-bottom:10px; }
        .progress-wrapper { background:var(--panel); border:1px solid var(--line-bright); padding:6px; }
        .progress-bar { background:var(--panel-2); border:1px solid var(--line); height:62px; overflow:hidden; position:relative; }
        .progress-fill { background:var(--accent); height:100%; width:0; }
        .progress-text { color:var(--text); font-size:20px; font-weight:400; left:50%; position:absolute; text-shadow:0 1px 8px rgba(0,0,0,.8); top:50%; transform:translate(-50%,-50%); z-index:3; }
        .status-message { color:var(--muted); font-size:15px; margin-top:12px; }
        .foot { border-top:1px solid var(--line); color:var(--dim); font-size:13px; margin-top:16px; padding:12px 4px 2px; text-align:center; }
        .foot a { color:var(--muted); }
        .foot a:hover, .foot a:focus { color:var(--accent); }
        @media (max-width:700px) { body { overflow:auto; } .app { padding:8px 10px; width:min(100% - 20px,560px); } .bar { font-size:12px; padding:8px 12px; } .layout { padding-top:14px; } h1 { font-size:40px; } .progress-bar { height:56px; } }
    
:root{--bg:#080b17;--panel:#111a2d;--panel-2:#17233b;--line:#293958;--line-bright:#40577f;--text:#f3f6ff;--muted:#aab7d2;--dim:#8290ad;--accent:#7897ff}
body{background-image:radial-gradient(ellipse at 78% 8%,#334f9b35,transparent 34%),radial-gradient(ellipse at 12% 42%,#573d9b28,transparent 32%),linear-gradient(145deg,#080b17,#0b1020 52%,#090d1b);font-family:Manrope,Arial,sans-serif}
.app{width:min(100% - 36px,900px);padding:20px 0 16px}
.bar{border:1px solid #9aafff22;border-radius:11px;background:#080d1bd9;font:600 11px DM Mono,monospace}
.bar b,.kicker,.progress-label{color:#7897ff}
.layout{justify-content:center;padding:44px 0}
h1{font:700 clamp(36px,6vw,58px)/1 Space Grotesk,sans-serif;letter-spacing:-2px}
h1 em{color:#7897ff}
.boot{color:#9ba9c7}
.progress-wrapper{background:#101729;border:1px solid #40577f;border-radius:9px;padding:5px}
.progress-bar{background:#0b1222;border:1px solid #293958;border-radius:5px;height:54px}
.progress-fill{background:linear-gradient(90deg,#7897ff,#67dff2)}
.progress-text{font:600 16px DM Mono,monospace}
.status-message{color:#aab7d2}
.foot{border-color:#9aafff18;color:#8290ad}
@media(max-width:700px){.app{width:calc(100% - 28px);padding-top:14px}.layout{padding:34px 0}}
</style>
</head>
<body>
    <div class="app">
        <header class="bar"><span><b>MODX</b> // ps4 hosts</span><span class="bar-fw">cache update</span></header>
        <main class="layout">
            <p class="kicker">$ ./cache --install</p>
            <h1>Loading <em>offline cache</em></h1>
            <ul class="boot"><li>[ <b>ok</b> ] psfree 1.7 chain ready</li><li>[ <b>..</b> ] downloading host files</li></ul>
            <section class="progress-container">
                <div class="progress-label" id="progress">Loading.. Please Wait !!!</div>
                <div class="progress-wrapper"><div class="progress-bar" id="myProgress"><div class="progress-fill" id="myBar"></div><div class="progress-text" id="progressText">0%</div></div></div>
                <div class="status-message" id="cacheStatus">Initializing cache system...</div>
            </section>
        </main>
        <footer class="foot">MODX // PS4 HOST PROJECT</footer>
    </div>
    <script>
        (function () {
            var appCache = window.applicationCache;
            var progressLabel = document.getElementById('progress');
            var progressBar = document.getElementById('myBar');
            var progressText = document.getElementById('progressText');
            var cacheStatus = document.getElementById('cacheStatus');
            var redirectPending = false;

            function setCached(value) {
                try { localStorage.is900StableCached = value ? 'true' : 'false'; } catch (e) {}
            }
            function setProgress(value) {
                var progress = Math.max(0, Math.min(100, value));
                progressBar.style.width = progress + '%';
                progressText.innerHTML = progress + '%';
            }
            function openHost(message) {
                if (redirectPending) return;
                redirectPending = true;
                setCached(true);
                setProgress(100);
                progressLabel.innerHTML = message;
                cacheStatus.innerHTML = 'Opening the cached host...';
                setTimeout(function () { window.location.replace('index5.html'); }, 1200);
            }
            if (!appCache) {
                progressLabel.innerHTML = 'Offline cache is not supported by this browser.';
                cacheStatus.innerHTML = 'Open this page in the PS4 browser.';
                return;
            }
            if (appCache.status === appCache.DOWNLOADING) setCached(false);
            appCache.ondownloading = function () {
                setCached(false);
                progressLabel.innerHTML = 'Page Caching Started!!';
                cacheStatus.innerHTML = 'Downloading host files. Do not close the browser.';
            };
            appCache.onprogress = function (event) {
                if (event.lengthComputable && event.total > 0) setProgress(Math.round(100 * event.loaded / event.total));
                else cacheStatus.innerHTML = 'Downloading host files...';
            };
            appCache.oncached = function () { openHost('Page Cached Successfully!!!'); };
            appCache.onupdateready = function () {
                try { appCache.swapCache(); } catch (e) {}
                openHost('Cache Updated Successfully!!!');
            };
            appCache.onnoupdate = function () { openHost('Offline Cache Ready'); };
            appCache.onerror = function () {
                setCached(false);
                progressLabel.innerHTML = 'Offline cache failed.';
                cacheStatus.innerHTML = 'Stay online, clear browser data, and reload this page.';
            };
            appCache.onobsolete = appCache.onerror;
        }());
    </script>
    
</body>
</html>
