<!DOCTYPE html>
<html lang="en" manifest="cache.manifest">
<head>
    <link rel="icon" type="image/png" href="../pspulse.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PSPULSE // 11.00-13.00 LAPSE</title>
<style>
    :root {
        --bg: #151515;
        --panel: #1c1c1c;
        --panel-2: #242424;
        --line: #2e2e2e;
        --line-bright: #454545;
        --text: #f5f5f5;
        --muted: #b5b5b5;
        --dim: #828282;
        --accent: #a294ff;
        --red: #ff9b9b;
        --amber: #e1bd72;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: var(--bg); }
    html, body { min-height: 100%; }
    body {
        background-color: var(--bg);
        background-image: linear-gradient(rgba(162, 148, 255, .05) 1px, transparent 1px),
            linear-gradient(90deg, rgba(162, 148, 255, .05) 1px, transparent 1px);
        background-size: 36px 36px;
        color: var(--text);
        font: 16px/1.45 Consolas, "Liberation Mono", monospace;
        min-height: 100vh;
        overflow: hidden;
    }

    .app { margin: 0 auto; padding: 14px 26px 12px; width: min(100% - 52px, 1220px); }

    /* Top status bar */
    .bar {
        align-items: center;
        border: 1px solid var(--line-bright);
        display: flex;
        font-size: 14px;
        justify-content: space-between;
        letter-spacing: .1em;
        padding: 10px 16px;
        text-transform: uppercase;
    }
    .bar b { color: var(--accent); font-weight: 400; }
    .bar-chain { color: var(--dim); }
    .bar-chain::before { color: var(--accent); content: "\25CF "; }

    #state { color: var(--accent); font-size: 22px; font-weight: 400; line-height: 1.25; margin: 18px 0 10px; }
    .ok { color: var(--accent); }
    .bad { color: var(--red); }
    .warn { color: var(--amber); }

    /* chain JS scrolls this element - keep overflow and a fixed height */
    #out {
        background: var(--panel);
        border: 1px solid var(--line-bright);
        color: var(--text);
        font: inherit;
        font-size: 13px;
        line-height: 1.45;
        height: calc(100vh - 150px);
        overflow-y: auto;
        padding: 12px 14px;
        white-space: pre-wrap;
    }

    @media (max-width: 760px) {
        .app { padding: 8px 10px; width: min(100% - 20px, 560px); }
        .bar { font-size: 12px; padding: 8px 12px; }
        #state { font-size: 19px; margin: 14px 0 8px; }
        #out { height: calc(100vh - 120px); font-size: 12px; }
    }
</style>
<style id="modx-minimal-console-theme">:root{--bg:#101216;--panel:#191c22;--panel-2:#20252d;--line:#303640;--line-bright:#414955;--text:#f1f3f6;--muted:#a3abb7;--dim:#858e9b;--accent:#91b8ff;--blue:#91b8ff;--cyan:#91b8ff;--violet:#91b8ff;--green:#8bd8b4;--red:#ef9299;--amber:#d8b875;color-scheme:dark}
html{background:#101216!important}body{background:#101216!important;background-image:none!important;color:var(--text)!important;font-family:Arial,Helvetica,sans-serif!important;overflow-x:hidden}a{color:inherit}
.app,.shell{width:min(100% - 36px,1080px)!important;margin-left:auto!important;margin-right:auto!important}
.bar,.topbar{background:#12151a!important;border:1px solid var(--line)!important;border-radius:8px!important;box-shadow:none!important;color:var(--text)!important}
.bar b,.kicker,h1 em,.eyebrow,.brand b,.np-open,.np-name b{color:var(--accent)!important}
h1{color:var(--text)!important;font-family:Arial,Helvetica,sans-serif!important;font-weight:750!important;letter-spacing:-1.8px!important}h1 em,h1 span{color:#aeb7c4!important;text-shadow:none!important}
.sub,.intro,.subtitle{color:var(--muted)!important;font-family:Arial,Helvetica,sans-serif!important;line-height:1.7}.boot{color:var(--muted)!important;font:500 10px/1.8 Consolas,monospace!important}.boot b,.ok{color:var(--green)!important}
.status,.status-panel,.panel,.controls,.progress-container,.notification,.notification2,#out{background:var(--panel)!important;border:1px solid var(--line)!important;border-radius:8px!important;box-shadow:none!important;color:var(--text)!important}
#state,.jailbreak-status{color:var(--accent)!important}#det,#cache,#cacheStatus,.status-meta,.status-message{color:var(--muted)!important}#det b{color:var(--text)!important}.bad,.status-fail{color:var(--red)!important}.warn{color:var(--amber)!important}
.notice{border-left-color:var(--amber)!important;background:#d8b8750b!important;color:var(--muted)!important}
button,.grid button,.grid-goldhen button,.language-toggle{background:#20252d!important;border:1px solid #414955!important;border-radius:6px!important;color:var(--text)!important;font-family:Arial,Helvetica,sans-serif!important;box-shadow:none!important;transition:border-color .12s ease,background-color .12s ease!important}
button:hover,button:focus,.grid button:hover,.grid button:focus,.grid-goldhen button:hover,.grid-goldhen button:focus{background:#282e38!important;border-color:var(--accent)!important;color:#fff!important}
button:focus-visible,.grid button:focus-visible,.grid-goldhen button:focus-visible,a:focus-visible{outline:2px solid var(--accent)!important;outline-offset:3px!important}
.grid-goldhen button:before,.grid button:before{border-color:var(--accent)!important;box-shadow:none!important}.grid-goldhen button:after,.grid button:after{color:var(--muted)!important}
.fw,.fw-display,.pill{background:#20252d!important;border:1px solid #414955!important;border-radius:6px!important;color:var(--accent)!important}.fw-card,.nodeplay,.step{background:var(--panel)!important;border:1px solid var(--line)!important;border-radius:8px!important;box-shadow:none!important}
.nodeplay:hover,.nodeplay:focus{border-color:var(--accent)!important;background:var(--panel-2)!important}.panel-title,.section-title,.section-head h2,.panel-head strong{color:#e7eaf0!important}
.progress-wrapper,.track{background:#0d1015!important;border:1px solid var(--line)!important;border-radius:6px!important;overflow:hidden}.progress-bar{background:#20252d!important;border-color:var(--line)!important;border-radius:5px!important}.progress-fill,#myBar{background:var(--accent)!important;box-shadow:none!important;border-radius:4px!important}.progress-text{color:#fff!important;text-shadow:none!important}#progressText{color:var(--accent)!important}
.step{background:#171a20!important}.step b{color:var(--accent)!important}.foot,footer{border-color:var(--line)!important;color:var(--dim)!important;font:500 8px/1.6 Consolas,monospace!important;letter-spacing:.8px!important}
.pspulse-support{border:1px solid #414955!important;border-radius:6px!important;background:#20252d!important;color:#c4d8ff!important;box-shadow:none!important}#out{border-color:var(--line)!important;background:#15191f!important;font-family:Consolas,monospace!important;overflow:auto!important}
@media(max-width:760px){.app,.shell{width:calc(100% - 24px)!important;padding-left:0!important;padding-right:0!important}.bar,.topbar{gap:9px}h1{letter-spacing:-1px!important}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}</style></head>
<body>
    <div class="app">
        <header class="bar">
            <span><b>PSPULSE</b> // ps4 hosts</span>
            <span class="bar-chain">lapse chain</span>
        </header>

        <div id="state">loading lapse chain...</div>
        <div id="out"></div>
    </div>
<script type="module">import "./chain_lapse.js";</script>
<script>
// PSPULSE: bounded auto-reload when the primitive gives up.
// Repeated SSV placement misses mean this page-load heap layout does not
// suit the groom, and only a fresh load reshuffles it (PS4 WebKit exposes
// no GC). The chain reports ceiling exhaustion as "attempt-ceiling" in the
// visible log on both lapse and poops runners; on sight, reload up to 2
// times, then stop and leave FAILED visible for manual retry.
// The budget write must verifiably persist, otherwise a broken
// sessionStorage would loop forever -- fail closed instead.
// Upstream core.js / chain_*.js are NOT modified.
(function () {
    var fwMatch = /PlayStation\s+4[\/ ](\d+\.\d+)/.exec(navigator.userAgent || "");
    var firmwareKey = fwMatch ? fwMatch[1] : "unknown";
    var KEY = "pspulse-slopkit-reloads:" + location.pathname + ":" + firmwareKey;
    var MAX = 2;
    var WINDOW_MS = 10 * 60 * 1000;
    var handled = false;
    function readBudget() {
        var rec = null;
        try { rec = JSON.parse(sessionStorage.getItem(KEY) || "null"); } catch (e) { rec = null; }
        var now = Date.now();
        if (!rec || typeof rec.n !== "number" || (now - rec.t) > WINDOW_MS) return { n: 0, t: now };
        return rec;
    }
    function spendBudget() {
        var rec = readBudget();
        rec.n++;
        rec.t = Date.now();
        try {
            sessionStorage.setItem(KEY, JSON.stringify(rec));
            var check = JSON.parse(sessionStorage.getItem(KEY) || "null");
            if (check && check.n === rec.n) return rec;
        } catch (e) {}
        return null;
    }
    var monitor = setInterval(function () {
        try {
            if (handled) return;
            var st = document.getElementById("state");
            if (st && st.className === "ok") {
                try { sessionStorage.removeItem(KEY); } catch (e) {}
                handled = true;
                clearInterval(monitor);
                return;
            }
            if (!st || st.textContent.indexOf("FAILED") === -1) return;
            var out = document.getElementById("out");
            var txt = out ? out.textContent : "";
            if (txt.indexOf("attempt-ceiling") === -1) return;
            handled = true;
            clearInterval(monitor);
            var rec = spendBudget();
            if (!rec || rec.n > MAX) return;
            st.textContent = "heap layout missed -- reloading for a fresh heap (" + rec.n + "/2)...";
            st.className = "warn";
            setTimeout(function () { location.reload(); }, 2000);
        } catch (e) { /* never break the exploit page */ }
    }, 3000);
})();
</script></body>
</html>
