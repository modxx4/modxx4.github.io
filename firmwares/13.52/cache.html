<!DOCTYPE html>
<html lang="en" manifest="cache.manifest">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MODX // PS4 13.02–13.52 HOST / CACHE</title>
    
    <style>
        :root {
            --bg: #080B17;
            --panel: #0D1324;
            --panel-2: #121B31;
            --line: #1D2A45;
            --line-bright: #2A3B5D;
            --text: #F4F7FF;
            --muted: #A6B2CC;
            --dim: #7583A1;
            --accent: #8796FF;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { background: var(--bg); }
        html, body { min-height: 100%; }
        body {
            background-color: var(--bg);
            background-image: linear-gradient(rgba(124, 140, 255, .05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(162, 148, 255, .05) 1px, transparent 1px);
            background-size: 36px 36px;
            color: var(--text);
            display: flex;
            flex-direction: column;
            font: 17px/1.4 Consolas, "Liberation Mono", monospace;
            min-height: 100vh;
            overflow: hidden;
        }
        a { color: inherit; }

        .app { display: flex; flex: 1 0 auto; flex-direction: column; margin: 0 auto; padding: 14px 26px 12px; width: min(100% - 52px, 920px); }

        /* Top status bar */
        .bar {
            align-items: center;
            border: 1px solid var(--line-bright);
            display: flex;
            font-size: 14px;
            justify-content: space-between;
            letter-spacing: .1em;
            padding: 10px 16px;
            text-transform: uppercase;
        }
        .bar b { color: var(--accent); font-weight: 400; }
        .bar-fw { color: var(--dim); }
        .bar-fw::before { color: var(--accent); content: "\25CF "; }

        .layout { display: flex; flex: 1 0 auto; flex-direction: column; justify-content: center; padding: 20px 0 0; }

        .kicker { color: var(--accent); font-size: 14px; letter-spacing: .14em; margin: 0 0 12px; }
        h1 { font-size: clamp(32px, 5vw, 52px); font-weight: 400; letter-spacing: -.07em; line-height: 1; margin: 0; }
        h1 em { color: var(--accent); font-style: normal; }
        .sub { color: var(--muted); font-size: 17px; margin: 13px 0 0; }
        .boot { color: var(--dim); font-size: 14px; list-style: none; margin: 12px 0 0; }
        .boot li { margin: 3px 0; }
        .boot b { color: var(--accent); font-weight: 400; }

        .progress-container { margin-top: 20px; width: 100%; }
        .progress-label { color: var(--accent); font-size: 15px; margin-bottom: 10px; }
        .progress-wrapper { background: var(--panel); border: 1px solid var(--line-bright); padding: 6px; }
        .progress-bar { background: var(--panel-2); border: 1px solid var(--line); height: 62px; overflow: hidden; position: relative; }
        .progress-fill { background: var(--accent); height: 100%; width: 0; }
        .progress-text { color: var(--text); font-size: 20px; font-weight: 400; left: 50%; position: absolute; text-shadow: 0 1px 8px rgba(0, 0, 0, .8); top: 50%; transform: translate(-50%, -50%); z-index: 3; }
        .status-message { color: var(--muted); font-size: 15px; margin-top: 12px; }

        .foot {
            border-top: 1px solid var(--line);
            color: var(--dim);
            font-size: 13px;
            margin-top: 16px;
            padding: 12px 4px 2px;
            text-align: center;
        }
        .foot a { color: var(--muted); }
        .foot a:hover, .foot a:focus { color: var(--accent); }

        @media (max-width: 700px) {
            body { overflow: auto; }
            .app { padding: 8px 10px; width: min(100% - 20px, 560px); }
            .bar { font-size: 12px; padding: 8px 12px; }
            .layout { padding-top: 14px; }
            h1 { font-size: 40px; }
            .progress-bar { height: 56px; }
        }
    </style>
<style id="modx-minimal-console-theme">:root{--bg:#101216;--panel:#191c22;--panel-2:#20252d;--line:#303640;--line-bright:#414955;--text:#f1f3f6;--muted:#a3abb7;--dim:#858e9b;--accent:#91b8ff;--blue:#91b8ff;--cyan:#91b8ff;--violet:#91b8ff;--green:#8bd8b4;--red:#ef9299;--amber:#d8b875;color-scheme:dark}
html{background:#101216!important}body{background:#101216!important;background-image:none!important;color:var(--text)!important;font-family:Arial,Helvetica,sans-serif!important;overflow-x:hidden}a{color:inherit}
.app,.shell{width:min(100% - 36px,1080px)!important;margin-left:auto!important;margin-right:auto!important}
.bar,.topbar{background:#12151a!important;border:1px solid var(--line)!important;border-radius:8px!important;box-shadow:none!important;color:var(--text)!important}
.bar b,.kicker,h1 em,.eyebrow,.brand b,.np-open,.np-name b{color:var(--accent)!important}
h1{color:var(--text)!important;font-family:Arial,Helvetica,sans-serif!important;font-weight:750!important;letter-spacing:-1.8px!important}h1 em,h1 span{color:#aeb7c4!important;text-shadow:none!important}

.nodeplay:hover,.nodeplay:focus{border-color:var(--accent)!important;background:var(--panel-2)!important}.panel-title,.section-title,.section-head h2,.panel-head strong{color:#e7eaf0!important}
.progress-wrapper,.track{background:#0d1015!important;border:1px solid var(--line)!important;border-radius:6px!important;overflow:hidden}.progress-bar{background:#20252d!important;border-color:var(--line)!important;border-radius:5px!important}.progress-fill,#myBar{background:var(--accent)!important;box-shadow:none!important;border-radius:4px!important}.progress-text{color:#fff!important;text-shadow:none!important}#progressText{color:var(--accent)!important}
.step{background:#171a20!important}.step b{color:var(--accent)!important}.foot,footer{border-color:var(--line)!important;color:var(--dim)!important;font:500 8px/1.6 Consolas,monospace!important;letter-spacing:.8px!important}
.pspulse-support{border:1px solid #414955!important;border-radius:6px!important;background:#20252d!important;color:#c4d8ff!important;box-shadow:none!important}#out{border-color:var(--line)!important;background:#15191f!important;font-family:Consolas,monospace!important;overflow:auto!important}
@media(max-width:760px){.app,.shell{width:calc(100% - 24px)!important;padding-left:0!important;padding-right:0!important}.bar,.topbar{gap:9px}h1{letter-spacing:-1px!important}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}</style></head>

<body>
    <div class="app">
        <header class="bar">
            <span><b>MODX</b> // ps4 hosts</span>
            <span class="bar-fw">cache update</span>
        </header>

        <main class="layout">
            <p class="kicker">$ ./cache --install</p>
            <h1>Loading <em>offline cache</em></h1>
            <ul class="boot">
                <li>[ <b>ok</b> ] slopkit chain ready</li>
                <li>[ <b>..</b> ] downloading host files</li>
            </ul>

            <section class="progress-container">
                <div class="progress-label" id="progress">Loading.. Please Wait !!!</div>
                <div class="progress-wrapper">
                    <div class="progress-bar" id="myProgress">
                        <div class="progress-fill" id="myBar"></div>
                        <div class="progress-text" id="progressText">0%</div>
                    </div>
                </div>
                <div class="status-message">Initializing cache system...</div>
            </section>
        </main>

        <footer class="foot">
            MODX // INDEPENDENT PS4 HOST PROJECT
        </footer>
    </div>

    <script>
(function () {
    var cache = window.applicationCache;
    var progress = document.getElementById("progress");
    var bar = document.getElementById("myBar");
    var progressText = document.getElementById("progressText");
    var redirected = false;

    function storageSet(value) {
        try { localStorage.setItem("is1352Cached", value ? "true" : "false"); }
        catch (error) {}
    }
    function show(message) {
        if (progress) progress.textContent = message;
    }
    function returnToHost(delay) {
        if (redirected) return;
        redirected = true;
        setTimeout(function () { window.location.replace("index.html"); }, delay);
    }

    if (!cache || !document.documentElement.hasAttribute("manifest")) {
        show("Application cache is unavailable. Returning to host...");
        returnToHost(1500);
        return;
    }

    cache.addEventListener("downloading", function () {
        show("Page caching started...");
        storageSet(false);
    }, false);
    cache.addEventListener("progress", function (event) {
        if (!event || !(event.total > 0)) return;
        var percent = Math.round(100 * event.loaded / event.total);
        if (bar) bar.style.width = percent + "%";
        if (progressText) progressText.textContent = percent + "%";
    }, false);
    cache.addEventListener("cached", function () {
        show("Page cached successfully.");
        storageSet(true);
        returnToHost(750);
    }, false);
    cache.addEventListener("updateready", function () {
        try { cache.swapCache(); } catch (error) {}
        show("Cache updated successfully.");
        storageSet(true);
        returnToHost(750);
    }, false);
    cache.addEventListener("noupdate", function () {
        storageSet(true);
        returnToHost(250);
    }, false);
    cache.addEventListener("error", function () {
        storageSet(false);
        show("Cache failed. Returning to online host...");
        returnToHost(1500);
    }, false);
    cache.addEventListener("obsolete", function () {
        storageSet(false);
        show("Cache is obsolete. Clear browser data and reopen the host.");
    }, false);

    if (cache.status === cache.UPDATEREADY) {
        try { cache.swapCache(); } catch (error) {}
        storageSet(true);
        returnToHost(250);
    } else if (cache.status === cache.IDLE) {
        try { cache.update(); } catch (error) { returnToHost(750); }
    }
}());
    </script>


</body>

</html>
