</head>
<body>
<svg class="glass-distortion-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false"><filter id="P4JB-glass-distortion" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency="0.008" numOctaves="2" seed="8" result="glassNoise"/><feDisplacementMap in="SourceGraphic" in2="glassNoise" scale="24" xChannelSelector="R" yChannelSelector="G"/></filter></svg>

    <div class="app">
        <header class="bar">
            <span><b>P4JB</b> // ps4 hosts</span>
            <span class="bar-chain">poops chain</span>
        </header>

        <div id="state">loading poops chain...</div>
        <div id="out"></div>
    </div>
<script type="module">import "./chain_poops.js";</script>
<script>
// P4JB: auto-reload DISABLED for poops (12.50/12.52/13.00).
// The attempt-ceiling monitor was removed here because its trigger
// (primitive "attempt-ceiling" in the log + FAILED state) persists in the
// visible log after the kernel has been touched (DOUBLE/TRIPLE-FREE).
// Reloading at that point re-enters on a dirty kernel without a reboot,
// which is a kernel-panic shape. Upstream (rawgame4 README) does manual
// reload only: a failed poops attempt means reboot, then retry.
// run_lapse.html keeps its own monitor; this file intentionally has none.
</script>
<footer class="modx-copyright"><span>© 2026 P4JB — Built for the PlayStation 4 community. All Rights Reserved.</span><span>Designed with passion. Powered by the community.</span></footer>
<script>
(function () {
  var endpoint = "https://faramawi.goatcounter.com/count";
  var storageKey = "p4jb_analytics_offline_v1";

  function readQueue() {
    try { return JSON.parse(localStorage.getItem(storageKey) || "[]"); }
    catch (e) { return []; }
  }

  function writeQueue(queue) {
    try {
      if (queue.length) localStorage.setItem(storageKey, JSON.stringify(queue));
      else localStorage.removeItem(storageKey);
    } catch (e) {}
  }

  function queueOfflineVisit() {
    var queue = readQueue();
    queue.push({
      path: location.pathname + location.search,
      title: document.title || "P4JB",
      referrer: document.referrer || ""
    });
    if (queue.length > 500) queue = queue.slice(-500);
    writeQueue(queue);
  }

  function flushQueue() {
    if (!navigator.onLine) return;
    var queue = readQueue();
    function sendNext() {
      if (!queue.length) { writeQueue([]); return; }
      var hit = queue[0];
      var pixel = new Image();
      pixel.onload = function () {
        queue.shift();
        writeQueue(queue);
        sendNext();
      };
      pixel.onerror = function () {};
      pixel.src = endpoint + "?p=" + encodeURIComponent(hit.path) +
        "&t=" + encodeURIComponent(hit.title) +
        "&r=" + encodeURIComponent(hit.referrer) +
        "&rnd=" + Date.now() + "-" + Math.floor(Math.random() * 1000000);
    }
    sendNext();
  }

  if (!navigator.onLine) queueOfflineVisit();
  window.addEventListener("online", flushQueue);
  window.addEventListener("pageshow", function () {
    if (navigator.onLine) flushQueue();
  });
})();
</script>
<script data-goatcounter="https://faramawi.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
